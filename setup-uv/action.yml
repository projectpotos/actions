---
name: Setup uv project
description: >-
  Check out the repository and install uv, ready to run project tooling
  (pytest, molecule, antsibull-changelog, ...).

inputs:
  python-version:
    description: Python version to install (empty = project default).
    required: false
    default: ""
  enable-cache:
    description: Enable the uv cache.
    required: false
    default: "true"
  fetch-depth:
    description: Number of commits to fetch (0 = full history).
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: ${{ inputs.enable-cache }}
        python-version: ${{ inputs.python-version }}
