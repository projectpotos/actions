---
name: Release Container

on:
  workflow_call:
    inputs:
      tags:
        description: Tag specification for docker/metadata-action (multiline).
        type: string
        required: true
      labels:
        description: OCI labels for docker/metadata-action (multiline).
        type: string
        required: false
        default: ""
      platforms:
        description: Comma-separated target platforms.
        type: string
        required: false
        default: linux/amd64
      setup-qemu:
        description: Set up QEMU for cross-platform builds.
        type: boolean
        required: false
        default: false
      registry:
        description: Container registry to publish to.
        type: string
        required: false
        default: ghcr.io
      image-name:
        description: Image name (defaults to the calling repository).
        type: string
        required: false
        default: ""
      context:
        description: Context directory for the Docker build.
        type: string
        required: false
        default: "."
      dockerfile:
        description: Path to the Dockerfile (relative to the context).
        type: string
        required: false
        default: Dockerfile

permissions: {}

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image-name || github.repository }}

jobs:
  build:
    name: build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to the registry (gated on non-PR events)
      id-token: write # keyless signing for the provenance attestation (gated on non-PR events)
      attestations: write # write the build-provenance attestation (gated on non-PR events)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: inputs.setup-qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance is generated by the dedicated attestation step below.
          provenance: false

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
