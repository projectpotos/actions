---
name: Test PR Labels

# Labels a pull request from its conventional-commit title (release-drafter
# autolabeler, see .github/release-drafter.yml) and fails unless the title or
# the labels match one of the release-drafter categories.
on:
  workflow_call:

permissions: {}

jobs:
  pr-labels:
    name: Check the pull request labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the autolabeler adds labels to the pull request
    steps:
      - name: Autolabel from the pull request title
        uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        # Fork pull requests get a read-only token; their labels must be set by hand.
        continue-on-error: true

      - name: Check the title and labels against the release-drafter categories
        uses: release-drafter/release-drafter/check-pr@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
